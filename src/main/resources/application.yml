# ============================================================
# 施工安全规范智能问答系统 配置
# 所有敏感/环境相关项都可用环境变量覆盖（IDEA 里在运行配置的
# Environment variables 一栏填写，或直接改这里的默认值）
# ============================================================

server:
  port: 8080
  error:
    # 把后端异常原因原样带给前端：否则接口报 500 时前端只能显示"入库失败：HTTP 500"，
    # 看不到"Chroma 未启动""向量维度不一致"这类真正有用的定位信息。
    include-message: always

spring:
  application:
    name: safety-rag-qa
  # 关掉 Spring AI 的 Chroma 自动配置，改用 config/VectorStoreConfig 自行装配：
  # Spring AI 1.0.0 靠"精确匹配错误文案"判断集合是否存在，而真实 Chroma 返回的文案
  # 对不上，导致空的向量库永远启动失败（Collection xxx does not exist.）。
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
  servlet:
    multipart:
      # 单个文件上限；max-request-size 是整批（批量上传一次可能带十几个文件）
      max-file-size: 50MB
      max-request-size: 200MB
  http:
    client:
      # 调用百炼用 JDK 自带的 java.net.http.HttpClient，不要用默认的 Apache HttpClient5。
      # 实测（同一台机器、同一个 key）：HttpClient5 发 chat 请求必然在 ~19 秒后被
      # "Connection reset"，连着 4 次全失败；JDK HttpClient 3/3 成功、4~6 秒返回。
      # 换成 jdk 后 chat / 流式 / embedding 全部正常，故此处固定下来。
      factory: jdk
      # 连接与读取超时：读取超时按"单次读"计时，流式逐 token 到达不受影响
      connect-timeout: 10s
      read-timeout: 120s
  ai:
    # Spring AI 自带的重试（包裹每一次 HTTP 调用）。百炼侧偶发 15~20 秒后
    # Connection reset，单次失败重试比整批入库重来便宜得多：
    # 3 次尝试、1s/2s 退避，最坏多花 3 秒而不是让 171 块的文档整个失败。
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 6s
    # ---------- OpenAI 兼容模型配置 ----------
    # 默认指向通义千问的 OpenAI 兼容端点；换 Kiwi 时改 base-url 即可：
    #   Kiwi:      https://api.Kiwi.com
    #   通义千问:      https://dashscope.aliyuncs.com/compatible-mode
    openai:
      base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      # 占位 key：未配置真实 key 时请保持 app.demo-mode=true（见文末），
      # 应用不会因为没 key 而启动失败
      api-key: ${LLM_API_KEY:sk-placeholder-set-LLM_API_KEY-in-env}
      chat:
        options:
          model: ${LLM_CHAT_MODEL:qwen-plus}
          temperature: 0.2
      embedding:
        options:
          # 通义 text-embedding-v3（1024 维）；也可替换为服务端提供的
          # bge-large-zh-v1.5 等兼容端点模型名
          model: ${LLM_EMBEDDING_MODEL:text-embedding-v3}
    # ---------- 向量库：Chroma（唯一实现） ----------
    # 装配代码见 config/VectorStoreConfig.java：自己建 tenant/database/collection，
    # 不依赖 Spring AI 的自动配置（它靠精确匹配错误文案判断集合是否存在，实测永远失败）。
    #
    # 前置条件（二选一，都要能访问下面的 host:port）：
    #   1) 本机 Docker：      docker compose up -d
    #   2) 远程/虚拟机 Docker：把 CHROMA_HOST 指过去即可（Chroma 本身不需要外网）
    # 换地址只改环境变量，别改这里：
    #   CHROMA_HOST=http://192.168.1.20 bash restart.sh
    # Windows 本机 pip 版（chromadb + chroma-hnswlib）在写入时必段错误，见 README 实测记录。
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        # Spring AI 用固定名字的 tenant/database，一般不用改
        tenant-name: ${CHROMA_TENANT:SpringAiTenant}
        database-name: ${CHROMA_DATABASE:SpringAiDatabase}
        collection-name: ${CHROMA_COLLECTION:safety-regulations}
        # 由 VectorStoreConfig 负责建集合，这里保留语义上的开关
        initialize-schema: true

# ---------- 本项目自定义配置（对应 config/AppProperties） ----------
app:
  # 演示模式开关：
  #   true  = 不调用任何外部模型 API，使用本地兜底 Embedding（字符 n-gram 哈希）
  #           + 抽取式回答（直接拼召回片段），无 key 也能完整演示全链路；
  #   false = 使用上面配置的真实聊天/向量模型。
  demo-mode: ${APP_DEMO_MODE:false}
  # 原始文档与注册表的存放目录（相对路径以项目根目录为准）
  data-dir: ${APP_DATA_DIR:./data}
  chunking:
    # 单块最大字符数（条款切分时整条超过该值才启用窗口兜底切分）
    chunk-size: 500
    # 窗口兜底切分时的重叠字符数
    overlap: 60
  retrieval:
    # 向量检索的最低相似度（低于该值的召回视为无召回，避免硬编答案）
    #
    # 这个数是实测出来的，不是拍的。用 12 条正样本 + 3 条负样本跑评测，向量路 top1
    # 原始分分布如下（见评测面板"语义分"列）：
    #   正样本 0.648 ~ 0.847（最低的是"楼外面围的那层绿网"）
    #   负样本 0.475 ~ 0.576（最高的是"今天食堂中午吃什么"）
    # 中间是一条 0.07 宽的空白带，阈值 0.60 正好落在带子中间。
    # 反过来说：0.20 这个旧值完全没有分界作用——负样本全在它上面。
    min-score: 0.60
    # 相似度尖峰门限（top1 与候选均值的差）。默认关闭，实测在这个语料上是负收益：
    # 同一主题的规范条文彼此都很像，正样本的候选分本来就"平摊一片"（top1-均值 仅 0.03），
    # 设 0.04 会把两条正样本直接杀成"无召回"；而闲聊问句因为完全不沾边，候选分掉得更快，
    # 反而形成了"假尖峰"，一条都没挡住。结论：本语料只能用绝对阈值判有没有召回。
    # 保留这个开关是为了换语料（比如跨领域混合库）时可以再试一次。
    margin: 0
    # 是否启用 BM25 关键词混合召回
    hybrid-enabled: true
    # 两路融合策略：
    #   rrf      = 倒数排名融合 score = w_v/(k+rank_v) + w_b/(k+rank_b)，只看名次
    #   weighted = 线性加权 score = w_v*向量分 + w_b*BM25归一化分（旧行为，做对照用）
    # 为什么默认 rrf：两路分数量纲不可比。BM25 归一化后 top1 恒为 1.0，而向量分
    # 相邻两名常常只差 0.02~0.05；线性加权下 BM25 那一个权重项就足以盖过语义差距，
    # 实测把 MRR 从 0.917 拖到 0.767、Hit@5 少命中 1 条。
    fusion: rrf
    # RRF 平滑常数：越大则各名次之间越平缓（60 是原始论文的常用值）
    rrf-k: 60
    # 融合权重（RRF 下作用于名次分，weighted 下作用于原始分）
    vector-weight: 1.0
    bm25-weight: 0.25
    # BM25 路的参与方式。
    # BM25 只认字面、不认语义：问题里只要有一个字出现在块里就有正分。若让它无条件
    # 引入新块，问"今天食堂吃什么"也会凑出几条食堂条款，"无召回不编造"就成了死代码
    # （这是本项目修复过的一个真实缺陷）。
    #
    # 所以它的语义是「有条件放开」：只有在向量路已经确认"这个问题库里确实有答案"
    # （min-score 有命中）之后，才允许 BM25 补充字面强命中的新块。
    #   向量路有召回 → 允许 BM25 引入（真正的混合收益：精确术语、编号、数字）
    #   向量路无召回 → 一律不许 BM25 救场，直接走拒答
    #   true/false 控制的是"有召回时"这一支，默认 true；
    #   填 false 则退化成"BM25 只能给已召回候选重排"，用来做对照实验。
    # 演示模式（哈希向量无语义）与向量库调用失败时无条件放开，此时 BM25 是唯一手段。
    bm25-introduce-new: true
    # BM25 原始分下限：低于它的块不参与融合。
    # 3.0 太严——实测 BM25 一条都没进来，混合检索等于没开（与纯向量指标完全一致）；
    # 1.0 太松——蹭到一个字的块也能进来抢名次。1.5 大致要求命中 2 个实词。
    min-bm25-score: 1.5

logging:
  level:
    com.example.safetyrag: INFO
    org.springframework.ai: INFO
