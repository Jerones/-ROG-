# ============================================================
# profile = chroma 时启用（启动参数：--spring.profiles.active=chroma）
# 作用：把向量库从默认的 SimpleVectorStore 切换为 Chroma。
# 装配代码见 config/ChromaVectorStoreConfig.java（自己建集合，不依赖
# Spring AI 的自动配置，因为它靠精确匹配错误文案判断集合是否存在，实测永远失败）。
#
# 前置条件（二选一，都要监听 8000）：
#   1) Docker：   docker compose up -d
#   2) 免 Docker：pip install "chromadb==0.5.23"
#                 chroma run --path ./data/chroma-server --host localhost --port 8000
# 详见 README「向量库」一节，含 Windows 下的已知限制。
# ============================================================
spring:
  ai:
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        # Spring AI 用固定名字的 tenant/database，一般不用改
        tenant-name: ${CHROMA_TENANT:SpringAiTenant}
        database-name: ${CHROMA_DATABASE:SpringAiDatabase}
        collection-name: ${CHROMA_COLLECTION:safety-regulations}
        # 由 ChromaVectorStoreConfig 负责建集合，这里保留语义上的开关
        initialize-schema: true
